# Servidor de estáticos para la imagen Docker del frontend.
# Fallback SPA: cualquier ruta que no sea un archivo (p. ej. /dashboard al recargar)
# devuelve index.html para que React Router la resuelva.
# (En Render, Static Site, el equivalente es la regla Rewrite /* -> /index.html.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets generados por Vite llevan hash en el nombre: se pueden cachear sin riesgo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
